name: CI

# 1️⃣ Run on every push to main and on every pull request.
# Limiting `push` to main (instead of all branches) avoids running the same
# commit twice - once for the push and once for its pull request.
on:
  push:
    branches: [main]
  pull_request:

# 2️⃣ The workflow only needs to READ the repo. Least privilege: if a
# dependency ever runs something malicious during install/test, the token
# it can see can't push code or touch anything else.
permissions:
  contents: read

# 3️⃣ A newer push to the same branch cancels the older, still-running
# check - it's about to be outdated anyway, and this saves CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # A hung test (e.g. a DB that never answers) fails after 10 minutes
    # instead of burning the default 6 hours.
    timeout-minutes: 10

    # 4️⃣ A throwaway MongoDB that lives only for this run. This is on
    # purpose NOT the Atlas cluster: tests delete every collection after
    # each test (see tests/setup.ts), parallel runs would wipe each other's
    # data, and it would mean storing the Atlas password as a CI secret.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        # Without a health check, the steps can start before Mongo is ready
        # to accept connections and the first tests fail randomly (flaky CI).
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # 5️⃣ Fake values, never real secrets: the tests only need SOMETHING to
    # sign tokens and webhooks with. tests/setup.ts appends "/pos-test" to
    # MONGODB_URI, so it ends up on the container's own pos-test database.
    env:
      MONGODB_URI: mongodb://localhost:27017
      JWT_SECRET: ci-only-jwt-secret
      PAYMOB_HMAC_SECRET: ci-only-hmac-secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Caches ~/.npm between runs so installs take seconds, not minutes
          cache: npm

      # 6️⃣ `npm ci` (not `npm install`): installs EXACTLY what
      # package-lock.json says and fails if it doesn't match package.json.
      # That's the guarantee we want in CI - the same versions every time.
      - name: Install dependencies
        run: npm ci

      # 7️⃣ Type-check only, no output files. Catches type errors that
      # `tsx` ignores at runtime (it strips types without checking them).
      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test
